<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StickerVerse Editor - Auto Embed</title>
  
  <!-- Load Editor CSS -->
  <link rel="stylesheet" href="./dist/stickerverse_sticker_editor.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: #0f172a;
    }
    .container {
      width: 100%;
      height: 100vh;
    }
    .info {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="info">
    ✨ StickerVerse Editor - Auto-initialized via data-container attribute
  </div>
  
  <!-- Container for the editor -->
  <div id="sticker-editor-container" class="container"></div>

  <!-- Load and auto-initialize StickerVerse Editor -->
  <!-- The data-container attribute tells the editor to auto-initialize -->
  <script 
    src="./dist/simple-sticker-editor.umd.js" 
    data-container="sticker-editor-container"
    data-config='{"debug": true}'>
  </script>
</body>
</html>
